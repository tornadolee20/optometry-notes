<!-- ══ Open Graph / Twitter Card 自動補強 ══════════════ -->
<script>
(function () {
  /* ── 設定區 ───────────────────────────────────────── */
  var SITE_CONFIG = {
    siteName    : '驗光師。目鏡大叔',
    siteUrl     : 'https://www.uncle-glasses.net',
    defaultImage: 'https://www.uncle-glasses.net/favicon.ico', /* 換成首頁 OG 圖 */
    twitterHandle: '@uncleglasses',
    locale      : 'zh_TW',
    fbAppId     : ''  /* 有 FB App ID 填入 */
  };
  /* ─────────────────────────────────────────────────── */

  function setMeta(property, content, isName) {
    if (!content) return;
    var attr = isName ? 'name' : 'property';
    var existing = document.querySelector('meta[' + attr + '="' + property + '"]');
    if (!existing) {
      var m = document.createElement('meta');
      m.setAttribute(attr, property);
      m.content = content;
      document.head.appendChild(m);
    }
  }

  function setCanonical() {
    if (!document.querySelector('link[rel="canonical"]')) {
      var link = document.createElement('link');
      link.rel  = 'canonical';
      link.href = window.location.href.split('?')[0].split('#')[0];
      document.head.appendChild(link);
    }
  }

  window.addEventListener('DOMContentLoaded', function () {
    var pageTitle = document.title || SITE_CONFIG.siteName;
    var pageDesc  = (document.querySelector('meta[name="description"]') || {}).content
                 || document.querySelector('.post-body p')?.innerText?.slice(0,120)
                 || '驗光師李錫彥的視光科普部落格';
    var pageImg   = document.querySelector('.post-body img')?.src
                 || SITE_CONFIG.defaultImage;
    var pageUrl   = window.location.href;

    // Open Graph
    setMeta('og:type',        'article');
    setMeta('og:site_name',   SITE_CONFIG.siteName);
    setMeta('og:title',       pageTitle);
    setMeta('og:description', pageDesc);
    setMeta('og:image',       pageImg);
    setMeta('og:url',         pageUrl);
    setMeta('og:locale',      SITE_CONFIG.locale);
    if (SITE_CONFIG.fbAppId)
      setMeta('fb:app_id', SITE_CONFIG.fbAppId);

    // Twitter Card
    setMeta('twitter:card',        'summary_large_image', true);
    setMeta('twitter:site',        SITE_CONFIG.twitterHandle, true);
    setMeta('twitter:title',       pageTitle, true);
    setMeta('twitter:description', pageDesc, true);
    setMeta('twitter:image',       pageImg, true);

    // Canonical
    setCanonical();
  });
})();
</script>
