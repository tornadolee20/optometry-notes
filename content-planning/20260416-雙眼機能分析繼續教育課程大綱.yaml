#  總頁數：30 slides
# ============================================================

course:
  title: "雙眼機能分析：你學過，但你用了嗎？"
  subtitle: "從教室到診間的臨床整合工作坊"
  instructor: "李錫彥 驗光師"
  affiliation: "社團法人新北市驗光師公會"
  duration_minutes: 120
  audience: "持照驗光師（有雙眼視覺學習背景，但臨床使用率低）"
  ce_hours: 2
  interactive_ratio: "45%（互動問答 + 即時演練）"
  tool_demo: "MYOWNVISION 雙眼機能分析平台（myownvision.com）"
  learning_objectives:
    - "能說出雙眼機能分析「卡住」的三道牆，並找到突破策略"
    - "能用『三層架構』整合斜位、調節力、融像儲備的相互關係"
    - "能正確判讀 Morgan norms 並識別臨床上最常見的三種異常模式"
    - "能在 10 分鐘內完成基礎雙眼機能篩查並向患者解釋結果"
    - "能操作 MYOWNVISION 輸入數據、解讀 OEP 圖表與 ZCSBV 功能圖"

# ============================================================
#  PART 1：破冰與鉤子（Slides 1-3）
# ============================================================

slides:

  - id: 1
    part: "Part 1｜開場鉤子"
    title: "你學了，但你用了嗎？"
    type: "title_hook"
    visual: |
      全黑背景，中央一句白字：
      「上次你做完整雙眼機能分析，是什麼時候？」
      下方小字：「（不含考試）」
    speaker_notes: |
      沉默 5 秒，讓問題發酵。
      不要立刻解答。接著說：
      「今天這兩個小時，我不打算重新教你課本。
       我要幫你把你已經知道的東西，串起來。」
    key_message: "認知衝突開場，製造安全的自我省視空間"
    interaction:
      type: "開場震撼"
      prompt: "沉默 5 秒 → 請一位學員分享上次做完整檢查是何時"
      expected_response: "多數會說『考完試就沒了』或『偶爾做斜位但不完整』"

  - id: 2
    part: "Part 1｜破冰"
    title: "舉手調查：你的診間現況"
    type: "interactive_poll"
    visual: |
      四個問題逐一出現，學員舉手：
      ① 我會常規測量遠近斜位 → 舉手
      ② 我會常規測量 BI/BO 融像儲備 → 舉手
      ③ 我會常規計算 AC/A → 舉手
      ④ 我看到數值後，知道下一步要怎麼做 → 舉手
    speaker_notes: |
      舉手數量通常是 ①>②>③>④（遞減）。
      在白板上記下每題人數，製造視覺衝擊。
      說：「這個遞減，不是你的錯，是系統設計問題。我們今天來修它。」
    key_message: "用真實數據建立共識：知識存在，但整合缺失"
    interaction:
      type: "舉手民調"
      facilitator_tip: "記錄四題人數在白板，貫穿全場使用"

  - id: 3
    part: "Part 1｜確立共識"
    title: "三種驗光師的雙眼世界"
    type: "storytelling"
    visual: |
      三個漫畫風格人物並排：
      🧪 學術型：「我知道 Sheard's criterion，但我不知道何時用。」
      ⏱️ 忙碌型：「我沒時間，每位客人 15 分鐘。」
      😕 迷失型：「我做了測試，但數值看不懂。」
    speaker_notes: |
      請學員舉手認領自己是哪一型（可以多選）。
      告訴他們：「今天你會同時打破這三種困境。」
      強調：時間問題是最大假設，今天會破解。
    content_bullets:
      - "學術型困境：理論完整，但臨床決策斷鏈"
      - "忙碌型困境：時間壓力造成整組檢查被跳過"
      - "迷失型困境：數值孤島，看不見全貌"
    key_message: "所有困境指向同一個根本問題：缺乏一個串連架構"
    interaction:
      type: "分類認領"
      prompt: "你是哪一型？可以多選，不評判"

# ============================================================
#  PART 2：根本原因分析（Slides 4-6）
# ============================================================

  - id: 4
    part: "Part 2｜根本原因"
    title: "三道牆：知識為什麼用不出來"
    type: "problem_analysis"
    visual: |
      三道磚牆圖示，每道牆一個標籤：
      牆一：「記憶牆」— 測試名稱與正常值分散記憶，無法即時提取
      牆二：「邏輯牆」— 不知道哪個數值異常時，下一步要測什麼
      牆三：「解釋牆」— 不知道怎麼跟患者說清楚
    content_bullets:
      - "記憶牆：Morgan norms、Sheard、Percival 各自孤立，考試完就忘"
      - "邏輯牆：缺乏一套決策流程，測了數值不知如何組合診斷"
      - "解釋牆：患者聽到『外隱斜』或『融像儲備不足』完全無感"
    speaker_notes: |
      這三道牆不是智力問題，是架構問題。
      說：「我在課本裡找不到一張圖，能把所有東西串起來。所以我自己建了一個。」
    key_message: "問題不是你不夠努力，而是缺少一張整合地圖"
    interaction:
      type: "共鳴確認"
      prompt: "哪道牆最打中你？請鄰座討論 1 分鐘"

  - id: 5
    part: "Part 2｜時間迷思破解"
    title: "『我沒時間做雙眼視覺』——這是真的嗎？"
    type: "myth_busting"
    visual: |
      時間軸對比圖：
      現況：完整雙眼機能分析 → 45-60 分鐘 ❌ 不現實
      今日目標：基礎篩查流程 → 8-10 分鐘 ✅ 可執行
      進階分析：有需求時深入 → 20-30 分鐘 ✅ 有依據
    content_bullets:
      - "完整學術版 vs 臨床精簡版：不是同一件事"
      - "80/20 法則：5 個關鍵測試能覆蓋 80% 的臨床決策需求"
      - "問題不是時間，是你不知道哪 5 個測試最關鍵"
    speaker_notes: |
      說：「今天結束前，你會知道這 5 個。」
      建立期待感，讓學員意識到問題是可解的。
    key_message: "精簡不等於不精準，關鍵是優先順序"
    critical_5_tests:
      - "遠距斜位（cover test / von Graefe）"
      - "近距斜位"
      - "NPC（近點集合）"
      - "近距 BO Break（聚合儲備）"
      - "NRA/PRA（調節儲備）"

  - id: 6
    part: "Part 2｜轉折點"
    title: "一個患者，改變了我的想法"
    type: "case_story"
    visual: |
      病歷卡風格：
      患者：25 歲男性，軟體工程師
      主訴：「近距工作 2 小時後頭痛，眼鏡剛配好、度數正確」
      常規驗光結果：度數無誤，矯正視力 1.0/1.0
      → 傳統流程：正常，無法解釋症狀
    content:
      story: |
        這種患者，你是不是也遇過？
        度數對了，視力好了，但患者還是不舒服。
        這不是心理問題，這是你沒量到的問題。
      reveal: |
        後來加做：
        近距斜位 → 10Δ 外斜
        BO Break → 14Δ（不足 Morgan norm 21Δ）
        Sheard 計算 → 不通過
        診斷：Convergence Insufficiency（集合不足）
        → 視覺訓練 6 週後症狀完全緩解
    key_message: "雙眼機能分析不是加分題，是解釋症狀的唯一鑰匙"
    interaction:
      type: "案例共鳴"
      prompt: "你有遇過類似的患者嗎？請舉手或分享"

# ============================================================
#  PART 3：整合架構（Slides 7-10）
# ============================================================

  - id: 7
    part: "Part 3｜整合架構"
    title: "雙眼機能分析樹：一張圖串起所有知識"
    type: "framework_reveal"
    visual: |
      大型樹狀圖（建議全頁動態出現）：
      根部：「雙眼視覺症狀」
      主幹：三大系統
        ├─ 🔵 聚散系統（Vergence System）
        ├─ 🟡 調節系統（Accommodation System）
        └─ 🔴 雙眼協調（Binocular Coordination）
      每個主幹再分枝（次投影片逐一展開）
    speaker_notes: |
      說：「你學的所有東西，都在這棵樹上。
      今天我們要做的，不是種新樹，
      而是把你腦袋裡的樹根，接回主幹。」
    key_message: "三大系統 × 互相制衡 = 雙眼機能的完整地圖"
    animation_hint: "主幹先出現，三條主枝逐一點亮"

  - id: 8
    part: "Part 3｜系統一"
    title: "系統一：聚散系統（Vergence）"
    type: "framework_deep_dive"
    visual: |
      聚散系統子樹展開：
      斜位（Phoria）
        ├─ 遠距斜位 → Morgan norm: 正位 ± 2Δ
        └─ 近距斜位 → Morgan norm: 6Δ exo ± 3Δ
      融像儲備（Fusional Reserves）
        ├─ BI（負融像） → Break 21Δ / Recovery 13Δ（近距）
        └─ BO（正融像） → Break 21Δ / Recovery 11Δ（近距）
      Sheard's Criterion
        └─ BO 儲備 ≥ 2 × 斜位量
      NPC（近點集合）
        └─ < 5cm（40歲以下）= 正常
    clinical_pearl: |
      ⭐ 臨床珍珠：外斜 + BO 不足 = 最常見的疲勞三角
      記憶口訣：「外斜要有兩倍 BO，才能撐住。」
    interaction:
      type: "快問快答"
      question: "患者近距 8Δ 外斜，需要多少 BO Break 才過 Sheard？"
      answer: "16Δ（2×8）"
      timing: "30秒搶答"

  - id: 9
    part: "Part 3｜系統二"
    title: "系統二：調節系統（Accommodation）"
    type: "framework_deep_dive"
    visual: |
      調節系統子樹展開：
      調節幅度（AA）
        └─ Hofstetter 公式：Average = 18.5 - 0.3 × 年齡
      NRA / PRA
        ├─ NRA：正常 +2.00D ± 0.50
        └─ PRA：正常 -2.37D ± 1.00
      MEM（動態視網膜鏡）
        └─ 正常：+0.25D ~ +0.75D（近距工作距離）
      Flipper（調節靈活度）
        └─ 正常：12 cpm（雙眼，40cm，±2.00 flipper）
      調節超前 / 落後
        └─ MEM > +1.00D → 調節落後（Accommodative Lag）
    clinical_pearl: |
      ⭐ 臨床珍珠：PRA 正值（本應為負）= 患者無法放鬆調節
      → 考慮 Over-minused 或調節痙攣
    interaction:
      type: "計算練習"
      question: "30 歲患者 AA 應為多少？實測 6D 有問題嗎？"
      answer: "Hofstetter 預期：18.5 - 9 = 9.5D。實測 6D 低 3.5D，屬調節不足。"
      timing: "1 分鐘同桌討論"

  - id: 10
    part: "Part 3｜系統三 + 整合"
    title: "系統三：雙眼協調（AC/A、CA/C）"
    type: "framework_deep_dive"
    visual: |
      雙眼協調子樹：
      AC/A 比（調節性集合/調節）
        ├─ Gradient 法：加 -1.00D 後斜位差值
        ├─ 正常範圍：3/1 ~ 5/1（Δ/D）
        ├─ 高 AC/A（>7/1）→ 近距內斜趨勢、調節痙攣風險
        └─ 低 AC/A（<3/1）→ 集合不足可能、稜鏡效果有限
      整合應用：
        "AC/A 決定你的處置選項"
        高 AC/A → 考慮加入 ADD（正鏡緩解集合）
        低 AC/A → 視覺訓練優先於稜鏡
    speaker_notes: |
      重點說：AC/A 是決策的轉折點。
      它告訴你「症狀從哪個系統來」「處置從哪裡下手」。
      這是很多驗光師遺漏的關鍵連結。
    key_message: "三個系統彼此制衡：改動一個，另外兩個都會變"
    visual_extra: |
      三角形圖示：
      聚散 ←——→ 調節
         ↖    ↗
         AC/A

# ============================================================
#  PART 4：臨床深度拆解（Slides 11-20）
# ============================================================

  - id: 11
    part: "Part 4｜臨床深度拆解"
    title: "斜位的臨床意義：數字背後的故事"
    type: "clinical_deep_dive"
    visual: |
      對比卡片排版（三欄）：

      正位（Ortho）| 外斜（Exo）| 內斜（Eso）

      遠距：
      0Δ → 最理想 | >5Δ → 注意 | >2Δ → 注意

      近距：
      6Δ exo → 正常 | >9Δ → 注意 | >2Δ → 注意
    clinical_rules:
      rule1: "遠距外斜 → 先問是否有高度近視度數撐住聚合"
      rule2: "近距大量外斜 + 高 NPC → Convergence Insufficiency"
      rule3: "遠距內斜 + 近距正常 → 可能 Divergence Excess，少見但重要"
      rule4: "遠近一致的外斜 → Basic Exophoria，處置先評估儲備量"
    interaction:
      type: "案例配對"
      cases:
        - patient: "25F，近距 12Δ exo，NPC 8cm，BO Break 10Δ"
          diagnosis: "Convergence Insufficiency"
        - patient: "35M，遠距 6Δ exo，近距 6Δ exo，BI/BO 正常"
          diagnosis: "Basic Exophoria，代償良好，觀察即可"
        - patient: "40F，遠距 8Δ eso，近距 2Δ eso，高 AC/A"
          diagnosis: "Divergence Insufficiency 或高度遠視殘留"
      prompt: "三個案例，2 分鐘同桌討論：各應如何處置？"

  - id: 12
    part: "Part 4｜臨床深度拆解"
    title: "Sheard's Criterion：最容易記、最常用的判斷準則"
    type: "clinical_deep_dive"
    visual: |
      公式卡（大字）：

      ✅ Sheard's Criterion
      BO 儲備（Break）≥ 2 × 斜位量（外斜用正值）

      若不通過 → 患者有症狀風險

      例子動畫：
      近距 8Δ exo：需要 BO Break ≥ 16Δ
      實測 BO Break 14Δ → 不通過 → 有症狀
    clinical_application: |
      ✅ 通過 = 系統有足夠儲備，多數無症狀
      ❌ 不通過 = 考慮：
        ① 稜鏡補正（BI prism 緩解外斜）
        ② 視覺訓練（增加 BO 儲備）
        ③ 正鏡補正（若高 AC/A）
    speaker_notes: |
      說：「Sheard 就是你的第一個臨床決策守門員。
      不通過，就是你要介入的信號。」
    prism_calculation:
      formula: "稜鏡量 = (2/3 × 斜位) - (1/3 × BO Break)"
      example: "8Δ exo，BO Break 14Δ → (2/3×8)-(1/3×14) = 5.3-4.7 = 0.6Δ BI prism"
    interaction:
      type: "現場計算"
      question: "近距 10Δ exo，BO Break 18Δ。過了 Sheard 嗎？需要稜鏡嗎？"
      answer: "需要 ≥20Δ，18Δ 不通過。稜鏡量：(2/3×10)-(1/3×18) = 6.7-6 = 0.7Δ BI"
      timing: "1 分鐘計算"

  - id: 13
    part: "Part 4｜臨床深度拆解"
    title: "Percival's Criterion：平衡不了就會累"
    type: "clinical_deep_dive"
    visual: |
      平衡秤圖示：

      BI 儲備  ⚖️  BO 儲備

      Percival：較小儲備 ≥ 1/2 較大儲備

      例子：
      BI Break 8Δ，BO Break 20Δ
      8 ≥ 20/2 = 10？→ 不通過（8 < 10）
    clinical_note: |
      Percival 補充 Sheard 的盲點：
      即使斜位小，若 BI/BO 極度不平衡，
      仍會造成長時間近距疲勞。

      常見於：
      - 過度訓練 BO（遊戲成癮者聚合過強）
      - 術後殘餘 BI 不足
    speaker_notes: |
      說：「Sheard 管的是「你夠不夠強」，
      Percival 管的是「你夠不夠均衡」。
      兩個都要過，患者才真的舒服。」
    interaction:
      type: "判斷練習"
      cases:
        - data: "BI Break 6Δ，BO Break 24Δ"
          question: "通過 Percival 嗎？"
          answer: "不通過。需要 6 ≥ 12，差距 6Δ"
        - data: "BI Break 12Δ，BO Break 20Δ"
          question: "通過嗎？"
          answer: "通過。12 ≥ 10"

  - id: 14
    part: "Part 4｜臨床深度拆解"
    title: "AC/A 比：隱藏的臨床分類器"
    type: "clinical_deep_dive"
    visual: |
      AC/A 刻度尺：

      低（<3）    正常（3-5）    高（>7）
      ←━━━━━━━━━━━━━━━━━━━━━━━━→
      集合不足型      理想       調節性集合過強型
    measurement_methods:
      gradient:
        name: "Gradient 法（臨床首選）"
        steps:
          - "1. 測量基礎近距斜位（例：6Δ exo）"
          - "2. 加 -1.00D 鏡片，再測斜位（例：9Δ exo）"
          - "3. 差值 = 調節反應量（3Δ 聚合增加）"
          - "4. AC/A = 差值 / 鏡片度數 = 3/1 = 3/1"
        note: "正常：加負鏡後，外斜應增加（聚合放鬆）"
      calculated:
        name: "計算法（需 IPD）"
        formula: "AC/A = IPD(cm) + (近距斜位 - 遠距斜位) / 調節量(D)"
    clinical_impact:
      high_aca: "高 AC/A → 稜鏡或 ADD 優先（加 +0.50D ADD 可減少 3-4Δ 內斜）"
      low_aca: "低 AC/A → 視覺訓練優先，稜鏡效果有限"
    interaction:
      type: "情境判斷"
      question: |
        12 歲患者，遠距 2Δ eso，近距 8Δ eso。
        Gradient 法：加 -1.00D 後近距變 3Δ eso。
        AC/A = ？臨床意義為何？
      answer: "AC/A = (8-3)/1 = 5/1，正常。但近距 eso 仍需處置，考慮加 ADD。"

  - id: 15
    part: "Part 4｜臨床深度拆解"
    title: "NPC（近點集合）：被遺忘的重要指標"
    type: "clinical_deep_dive"
    visual: |
      動作演示圖（建議 GIF 或簡報動畫）：
      靶標從遠移近 → 患者回報模糊/複視的點

      正常值表（年齡分層）：
      ─────────────────────────────
      年齡        NPC（破裂點）  NPC（回復點）
      < 40 歲     ≤ 5cm         ≤ 7cm
      40-50 歲    ≤ 6cm         ≤ 8cm
      50-60 歲    ≤ 7cm         ≤ 9cm
      > 60 歲     ≤ 8cm         ≤ 10cm
      ─────────────────────────────
    clinical_pearl: |
      ⭐ 重要提醒：測三次取平均值！
      第一次通常最好，練習效應讓第三次更真實。

      ⭐ 高 NPC + 低 BO = Convergence Insufficiency 最強組合指標
    speaker_notes: |
      說：「NPC 是一個 30 秒的測試，能告訴你患者『聚合在哪裡崩潰』。
      這是 CI 的黃金診斷標準。你的診間沒有理由不做。」
    interaction:
      type: "動作演練"
      prompt: "兩兩配對，現場互測 NPC，比較雙方結果"
      duration_minutes: 3

  - id: 16
    part: "Part 4｜臨床深度拆解"
    title: "CISS 問卷：讓患者的症狀說話"
    type: "clinical_deep_dive"
    visual: |
      CISS（Convergence Insufficiency Symptom Survey）說明卡：

      15 題症狀問卷（5 分制）：
      ✦ 近距閱讀時眼睛疲勞
      ✦ 複視（間歇性）
      ✦ 閱讀時字會移動或跳動
      ✦ 頭痛（前額/眼眶）
      ✦ 需要重讀同一行
      ... 等 15 題

      評分：
      ≤ 16 分：正常
      16-21 分：邊界
      ≥ 21 分：有症狀 CI（敏感度 72%，特異度 81%）
    speaker_notes: |
      說：「CISS 的價值不在診斷，而在溝通。
      患者填完問卷，你說：『你有 23 分，超過正常值。這 3 題跟你的頭痛直接相關。』
      患者立刻理解，而且願意配合治療。」
    clinical_application: |
      ① 初診：篩查有無雙眼視覺相關症狀
      ② 治療前：建立基準線
      ③ 治療後：追蹤療效（分數下降 = 有效）
    interaction:
      type: "自我填寫體驗"
      prompt: "請每位學員現在填一份 CISS（QR code 提供），感受患者視角"
      qr_note: "投影播放 CISS QR code 連結"

