  - id: 30
    part: "Part 7｜收尾"
    title: "你已經把它串起來了"
    type: "closing"
    visual: |
      回到 Slide 7 的「雙眼機能分析樹」圖，
      但這次所有枝幹都亮起來，
      文字出現：「你已經知道每一個枝節了。」
    closing_message: |
      你今天沒有學到新東西。
      你只是把你已經知道的東西，串起來了。

      雙眼機能分析不是選修課，
      是你診斷病因最後一塊拼圖。

      每一位說「我度數對了但還是不舒服」的患者，
      都在等你用這把鑰匙開門。
    qa_prompt: |
      開放問答（15 分鐘）：
      ✦ 臨床疑難案例討論
