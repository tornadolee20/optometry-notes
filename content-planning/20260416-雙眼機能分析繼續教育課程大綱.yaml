      topic2:
        title: "調節不足"
        before: "你的 AA 低於 Hofstetter 均值 3D，PRA 不足。"
        after: |
          「你眼睛的對焦肌肉有點提早退步。
           正常 30 歲可以對到 40 公分，
           但你現在大概只到 50 公分就模糊了。
           電腦螢幕就在那個臨界點上。」
      topic3:
        title: "治療需要時間"
        before: "視覺訓練需要 6-12 週才有效。"
        after: |
          「你去健身房練二頭肌，
           第一週看不太出來，
           但六週後就有感覺了。
           眼睛的肌肉訓練也一樣。」
    key_principle: |
      溝通三原則：
      ① 用身體比喻，不用數字解釋
      ② 告訴患者「為什麼不舒服」，不只是「什麼異常」
      ③ 給明確的下一步：「我們這樣做，6 週後你來告訴我有沒有差」

  - id: 29
    part: "Part 6｜實戰落地"
    title: "你的雙眼視覺升級路線圖"
    type: "roadmap"
    visual: |
      三階段升級路徑圖：
    roadmap:
      phase1:
        name: "Week 1-2：建立習慣"
        actions:
          - "把 8 分鐘篩查加入有症狀患者的流程"
          - "印出 Morgan Norms 速查表貼診間"
          - "試用 MYOWNVISION 輸入 3 位真實患者"
        milestone: "第一位患者透過雙眼分析得到新診斷"
      phase2:
        name: "Month 1-2：建立信心"
        actions:
          - "對每位有近距症狀的患者常規做篩查"
          - "學會用白話版報告跟家長解釋（特別是學生族群）"
          - "追蹤第一批 CI/AI 患者的 CISS 分數變化"
        milestone: "成功說服一位患者進行視覺訓練"
      phase3:
        name: "Month 3+：建立聲譽"
        actions:
          - "建立『雙眼機能評估特診』服務項目"
          - "在你的診所/公司成為雙眼視覺的 go-to person"
          - "分享成功案例（可匿名）給同業社群"
        milestone: "因雙眼機能評估獲得患者轉介"
    interaction:
      type: "個人承諾"
      prompt: "拿出一張紙，寫下你明天要做的第一個改變。不需要分享，留著提醒自己。"

