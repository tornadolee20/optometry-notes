  - id: 18
    part: "Part 4｜臨床深度拆解"
    title: "調節系統四兄弟：AA、NRA、PRA、MEM"
    type: "clinical_deep_dive"
    visual: |
      四格宮格圖：

      ┌─────────────┬─────────────┐
      │  AA          │  NRA         │
      │  「天花板」  │  「鬆弛上限」│
      │  幅度決定能  │  +2.00D = 正 │
      │  做什麼      │  常最大放鬆  │
      ├─────────────┼─────────────┤
      │  PRA         │  MEM         │
      │  「施力上限」│  「當下位置」│
      │  -2.37D = 正 │  +0.50D = 在 │
      │  常最大施力  │  工作距離的  │
      │              │  調節反應    │
      └─────────────┴─────────────┘
    relationships: |
      臨床整合解讀：

      MEM > +1.00D → 調節落後（過度放鬆）→ 有近視控制意義
      MEM < 0D → 調節超前（過度緊張）→ 考慮調節痙攣
      PRA 不足（< -1.50D）→ 調節施力受限 → 影響持久近距工作
      NRA 不足（< +1.50D）→ 無法充分放鬆 → 近距疲勞主因

      口訣：
      「NRA 鬆、PRA 緊、MEM 看位置、AA 定天花板」
    interaction:
      type: "案例分析"
      case: |
        25 歲工程師：
        AA: 8D（Hofstetter 預期 10.5D，稍低）
        NRA: +2.50D（正常）
        PRA: -1.00D（低於正常）
        MEM: +0.75D（稍高）
        主訴：下午工作後眼睛撐不住，視力會變模糊
      question: "哪個指標最能解釋他的症狀？處置方向？"
      answer: "PRA 不足是主因：施力上限低，無法維持長時間調節。考慮調節訓練 + 工作距離調整。"

