    body_right:
      heading: "甩鏡轉場"
      points:
        - "適合切段落"
        - "可藏剪接點"
        - "節奏感更強"
    visual_direction: "左右兩示意框，加動態箭頭與模糊軌跡。"

  - id: 6
    title: "環形燈 vs 柔光箱：怎麼選"
    subtitle: "先看你要的是方便，還是質感"
    body:
      - "環形燈：平、亮、快，適合直播與近距離口播。"
      - "柔光箱：柔、厚、立體，適合課程、訪談、品牌感內容。"
      - "如果想做高級感，柔光箱通常更穩。"
    takeaway: "快速開拍選環形燈，想做高質感選柔光箱。"
    visual_direction: "決策矩陣頁，保持簡潔。"

  - id: 7
    title: "iPhone 拍 Reels 的實用設定"
    subtitle: "先把素材拍對，後製才不會救火"
    body:
      - "解析度：4K"
      - "幀率：24fps 或 30fps 為主"
      - "關閉 HDR"
      - "鎖白平衡 / 鎖鏡頭"
    note: "需要慢動作時再切高幀率，不要所有素材都拍 60fps。"
    visual_direction: "像設定頁，但更乾淨、舒服。"

  - id: 8
    title: "剪輯不是加特效，而是刪掉多餘"
    subtitle: "會剪的人，不是做最多效果的人"
    body:
      - "剪掉停頓、口頭禪、無效鋪陳。"
      - "讓每一個切點都更接近重點。"
      - "先求清楚，再求風格。"
    visual_direction: "章節頁轉場，搭配時間軸抽象圖。"

  - id: 9
    title: "CapCut / 剪映的標準工作流"
    subtitle: "先粗剪，再字幕，再節奏，再風格"
    body:
      - "粗剪：刪停頓與贅字"
      - "字幕：自動字幕後手修"
      - "節奏：切點貼合語氣與節拍"
      - "視覺：少量轉場與字卡"
      - "輸出：1080p 高碼率"
    visual_direction: "五張步驟卡，由左至右。"

  - id: 10
    title: "字幕與文字排版的審美原則"
    subtitle: "字幕是第二條注意力軌道"
    body:
      - "要做：每行短、關鍵字上色、節奏跟語氣走。"
      - "不要做：整段塞滿、特效太多、每個字都跳。"
      - "字幕的功能是輔助理解，不是製造噪音。"
    visual_direction: "左對右錯，下方放字幕示意條。"

  - id: 11
    title: "讓影片看起來貴的 5 個細節"
    subtitle: "高級感通常不是多，而是準"
    body:
      - "色調一致"
      - "曝光穩定"
      - "聲音乾淨"
      - "切點果斷"
      - "封面有主題字"
    visual_direction: "五個大數字搭配短句。"

  - id: 12
    title: "不要只追觀看，要接到轉換"
    subtitle: "最有價值的 Reels，會把流量帶到 DM"
    body:
      - "Reels 觀看"
      - "留言關鍵字"
      - "ManyChat 自動回覆"
      - "DM 資源交換"
      - "名單 / 預約 / 成交"
    takeaway: "真正值錢的不是觀看本身，而是後續關係。"
    visual_direction: "由寬到窄的漏斗圖。"

  - id: 13
    title: "案例拆解：一支有效 Reels 長什麼樣"
    subtitle: "把方法落到實際節奏"
    body:
      - "0-2 秒：痛點 Hook"
      - "3-8 秒：立刻給 1 個答案"
      - "9-14 秒：補一個常見錯誤"
      - "15-20 秒：CTA 導向留言或 DM"
    takeaway: "一支片不需要很多點，只要節奏完整。"
    visual_direction: "像分鏡腳本條，帶秒數。"

  - id: 14
