---
deck:
  title: "Reels 製作實務教學"
  subtitle: "兩堂行銷課逐頁 PPT 文案版"
  based_on: "content-planning/20260420-reels-marketing-course-deck.yaml"
  date: "2026-04-20"
  language: "zh-TW"
  ratio: "16:9"
  total_slides: 28

global_style:
  tone: "專業、舒服、俐落、不要吵"
  typography:
    title: "Noto Serif TC SemiBold"
    body: "Noto Sans TC Regular"
  palette:
    ink: "#1F2937"
    paper: "#FFFDFC"
    ivory: "#F7F3EC"
    coral: "#E77B62"
    moss: "#6F8A73"
    gold: "#C89B58"
  layout_rules:
    - "一頁一重點"
    - "正文盡量不超過 40-55 字"
    - "同頁若有三點，長短要接近"
    - "圖優先大，字優先少"

slides:
  - id: 1
    title: "Reels 製作實務教學"
    subtitle: "把短影音做成流量、信任與成交"
    page_copy:
      lead: "這堂課不是教你亂追流量，而是教你建立可複製的 Reels 產出系統。"
      footer: "策略 × 腳本 × 拍攝 × 剪輯 × 轉換"
    speaker_notes:
      - "開場先定調：今天不是工具炫技，而是完整內容流程。"
      - "讓學員知道，兩堂課會一路走到轉換。"
    visual_direction: "米白底，大標置左，右側放高質感直式口播畫面。"

  - id: 2
    title: "今天會帶走什麼"
    subtitle: "先看地圖，再上路"
    page_copy:
      left:
        - "第一堂：平台邏輯"
        - "第一堂：高留存腳本"
        - "第一堂：爆點與 CTA"
      right:
        - "第二堂：拍攝與佈光"
        - "第二堂：剪輯與模板"
        - "第二堂：自動化與轉換"
    speaker_notes:
      - "把全貌先講清楚，學員會更穩。"
    visual_direction: "左右雙欄，大數字 1 / 2 當版面主視覺。"

  - id: 3
    title: "為什麼現在還要做 Reels？"
    subtitle: "因為它仍是最便宜的注意力入口"
    page_copy:
      stats:
        - "21% 行銷人員回報短影音帶來最高 ROI"
        - "73% 專業人士認為 30 秒到 2 分鐘最具影響力"
      takeaway: "圖文建立信任，短影音搶注意力，兩者要分工，不是互斥。"
    speaker_notes:
      - "這頁只做一件事：讓大家覺得值得學。"
    visual_direction: "中央大數字，下方一條結論句。"

  - id: 4
    title: "TikTok 與 Reels，不是一樣的戰場"
    subtitle: "同樣是短影音，打法不一樣"
    page_copy:
      left_title: "TikTok"
      left_points:
        - "娛樂性更強"
        - "節奏更野更快"
        - "更容許粗糙實驗"
      right_title: "Instagram Reels"
      right_points:
        - "更重視審美"
        - "更適合品牌包裝"
        - "更適合導向私訊與成交"
    speaker_notes:
      - "要提醒學員：Reels 不是把 TikTok 內容原封搬過來。"
    visual_direction: "兩張大卡對照，Reels 那邊更精緻。"

  - id: 5
    title: "2026 Reels 的底層邏輯"
    subtitle: "平台在乎的是這三件事"
    page_copy:
      pillars:
        - "看得久"
        - "願意分享"
        - "願意互動"
      support: "觀看時間是第一關，分享是擴散引擎，按讚與留言更像滿意度訊號。"
    speaker_notes:
      - "把演算法翻成人話，不要講得太工程。"
    visual_direction: "三個大圓或三根柱子，底下各有一句解釋。"

  - id: 6
    title: "內容怎麼被推廣出去"
    subtitle: "先測，再放大"
    page_copy:
      flow:
        - "小樣本測試"
        - "看前 1-3 秒反應"
        - "評估留存與分享"
        - "合格才放大分發"
      takeaway: "粉絲少不代表沒機會，因為平台會先做非粉絲測試。"
    speaker_notes:
      - "這頁是用來破除『我粉絲太少所以沒用』的心魔。"
    visual_direction: "水平箭頭流程圖。"

  - id: 7
    title: "三個常見誤會"
    subtitle: "很多帳號不是不努力，是努力方向錯了"
    page_copy:
      myths:
        - "粉絲少就做不起來 → 錯，非粉測試流量仍存在"
        - "影片越長越專業 → 錯，新受眾更吃短狠清楚"
        - "按讚高就一定會爆 → 錯，分享與停留更關鍵"
    speaker_notes:
      - "這頁講完，學員的舊觀念要被翻掉。"
    visual_direction: "上面寫誤會，下面寫真正答案。"

  - id: 8
    title: "長度策略：不同目的，不同秒數"
    subtitle: "不要用同一種片長解決所有問題"
    page_copy:
      ranges:
        - "7-15 秒：拓新、提高完播、重播"
        - "20-45 秒：教學、觀點、案例"
        - "45-90 秒：建立信任、深度說服"
      takeaway: "想打新受眾，通常先從短而狠開始。"
    speaker_notes:
      - "提醒學員：長短不是好壞，而是任務不同。"
    visual_direction: "時間條視覺化，20-45 秒用金色重點。"

  - id: 9
    title: "第一堂重點二"
    subtitle: "腳本不是文案，是注意力編排"
    page_copy:
      lead: "影片是否留人，很多時候在你開口之前就決定了。"
    speaker_notes:
      - "這頁只當章節轉場，節奏要俐落。"
    visual_direction: "章節頁，乾淨，大字。"

  - id: 10
    title: "一支 Reels 的標準骨架"
    subtitle: "Hook、Value、Rehook、CTA"
    page_copy:
      stack:
        - "Hook：讓人停下來"
        - "Value：立刻給答案"
        - "Rehook：中段再拉一次注意力"
        - "CTA：只給一個動作"
    speaker_notes:
      - "這頁是接下來所有腳本頁的總綱。"
    visual_direction: "四層階梯或垂直堆疊。"

  - id: 11
    title: "Hook 寫法：前三秒只做一件事"
    subtitle: "讓人停，不是把話講完"
    page_copy:
      formulas:
        - "痛點直擊"
        - "反常識"
        - "結果前置"
        - "好奇缺口"
      examples:
        - "為什麼你拍 Reels 都像作業？"
        - "99% 的人一開始就把片做長了"
        - "這樣改，完播率會差很多"
        - "沒人提醒你的第一秒錯誤"
    speaker_notes:
      - "直接唸例子，效果比抽象定義更強。"
    visual_direction: "左公式右例句，例句用引號視覺。"

  - id: 12
    title: "中段留人：每 3 到 5 秒要有變化"
    subtitle: "觀眾不是不看，是不想被拖"
    page_copy:
      columns:
        - title: "畫面"
          points: ["切角度", "推近", "插 B-roll"]
        - title: "文字"
          points: ["關鍵字跳出", "數字放大", "逐字高亮"]
        - title: "語氣"
          points: ["反問一句", "先否定再翻", "補小案例"]
    speaker_notes:
      - "強調這些不是花招，而是節奏。"
    visual_direction: "三欄卡片，整齊、節奏感強。"

  - id: 13
    title: "Rehook：中途再勾一次"
    subtitle: "觀眾快滑走時，再給一個留下的理由"
    page_copy:
      lines:
        - "但真正影響觸及的，不是你以為的那個。"
        - "更重要的是，這一步大多數人都漏掉。"
        - "如果你只記得一件事，就是這個。"
    speaker_notes:
      - "可以請學員現場唸一遍，感受語氣。"
    visual_direction: "三條字幕樣式橫排。"

  - id: 14
    title: "CTA：一支影片只做一個收尾動作"
    subtitle: "CTA 太多，轉換反而更差"
    page_copy:
      bad: "按讚、留言、追蹤、點連結，全都要"
      good:
        - "把這支傳給同事"
        - "留言『模板』拿資源"
        - "私訊我『課表』"
      takeaway: "一支片，一個明確動作。"
    speaker_notes:
      - "這頁很重要，因為很多人卡在什麼都想要。"
    visual_direction: "左亂右清楚。"

  - id: 15
    title: "課堂練習：20 秒腳本拆解"
    subtitle: "把方法立刻變成句子"
    page_copy:
      prompts:
        - "主題：你要幫誰解決什麼問題？"
        - "Hook：一句話讓他停下來"
        - "Value：給 2 個要點"
        - "CTA：只留 1 個動作"
      footer: "練習 8 分鐘，等一下抽 2 組分享。"
    speaker_notes:
      - "這頁故意做得像工作紙，讓課程節奏從聽轉成做。"
    visual_direction: "大留白、淡框線。"

  - id: 16
    title: "第二堂重點一"
    subtitle: "拍攝與畫面，不是設備堆砌，是視覺秩序"
    page_copy:
      lead: "拍攝的任務，是讓內容看起來可信、清楚、願意看完。"
    speaker_notes:
      - "第二堂開始，語氣從策略轉進實務。"
    visual_direction: "章節頁，偏 moss 色系。"

  - id: 17
    title: "9:16 構圖的三個原則"
    subtitle: "手機畫面比你想像中更擠"
    page_copy:
      principles:
        - "主體置中：人與商品沿中軸安排"
        - "保留安全區：避開上方資訊與右下互動 UI"
        - "預留字幕空間：頭頂或側邊留乾淨背景"
    speaker_notes:
      - "這頁可以直接配一張錯誤示範與正確示範。"
    visual_direction: "直式手機框示意圖。"

  - id: 18
    title: "運鏡只要會兩種就夠了"
    subtitle: "穩定推近，和能藏剪接的甩鏡"
    page_copy:
      left:
        - "穩定推近：適合口播"
        - "增加重點壓力"
        - "畫面更有進展感"
      right:
        - "甩鏡轉場：適合切段落"
        - "可藏剪接點"
        - "節奏感更強"
    speaker_notes:
      - "不要讓學員覺得自己需要學十種鏡頭。"
    visual_direction: "左右兩個示意框，加動態箭頭。"

  - id: 19
    title: "環形燈 vs 柔光箱：怎麼選"
    subtitle: "先看你要的是方便，還是質感"
    page_copy:
      rows:
        - "光感：環形燈平亮直接；柔光箱柔厚立體"
        - "場景：環形燈適合直播；柔光箱適合課程口播"
        - "限制：環形燈易扁平反光；柔光箱較占空間"
      recommendation: "快速開拍選環形燈，想做高級感選柔光箱。"
    speaker_notes:
      - "這頁幫大家做選擇，不要陷入器材焦慮。"
    visual_direction: "決策矩陣，但要簡潔。"

  - id: 20
    title: "iPhone 拍 Reels 的實用設定"
    subtitle: "先把素材拍對，後製才不會救火"
    page_copy:
      cards:
        - "解析度：4K"
        - "幀率：24fps 或 30fps 為主"
        - "關閉 HDR"
        - "鎖白平衡 / 鎖鏡頭"
      note: "要慢動作時再切高幀率，不要所有素材都拍 60fps。"
    speaker_notes:
      - "這頁講完，學員回去就能立即調手機。"
    visual_direction: "像設定介面，但更乾淨好看。"

  - id: 21
    title: "第二堂重點二"
    subtitle: "剪輯不是加特效，而是刪掉多餘"
    page_copy:
      lead: "會剪的人，不是做最多效果的人，而是最知道哪裡該停的人。"
    speaker_notes:
      - "這頁是把大家從特效迷思拉回來。"
    visual_direction: "章節頁，帶時間軸抽象圖。"

  - id: 22
    title: "CapCut / 剪映的標準工作流"
    subtitle: "先粗剪，再字幕，再節奏，再風格"
    page_copy:
      steps:
        - "粗剪：刪停頓與贅字"
        - "字幕：自動字幕後手修"
        - "節奏：切點貼合語氣與節拍"
        - "視覺：少量轉場與字卡"
        - "輸出：1080p 高碼率"
    speaker_notes:
      - "這頁是最能讓新手安心的一頁。"
    visual_direction: "五張步驟卡，由左到右。"

  - id: 23
    title: "字幕與文字排版的審美原則"
    subtitle: "字幕是第二條注意力軌道"
    page_copy:
      do:
        - "每行短"
        - "關鍵字上色"
        - "出現節奏跟語氣走"
      dont:
        - "整段塞滿"
        - "特效太多"
        - "每個字都跳"
    speaker_notes:
      - "強調字幕不是把逐字稿全部貼上去。"
    visual_direction: "左對右錯，底部模擬字幕範例。"

  - id: 24
    title: "讓影片看起來貴的 5 個細節"
    subtitle: "高級感通常不是多，而是準"
    page_copy:
      details:
        - "色調一致"
        - "曝光穩定"
        - "聲音乾淨"
        - "切點果斷"
        - "封面有主題字"
    speaker_notes:
      - "這頁很適合當成學員檢查清單。"
    visual_direction: "五個大數字搭配短句。"

  - id: 25
    title: "不要只追觀看，要接到轉換"
    subtitle: "最有價值的 Reels，會把流量帶到 DM"
    page_copy:
      funnel:
        - "Reels 觀看"
        - "留言關鍵字"
        - "ManyChat 自動回覆"
        - "DM 資源交換"
        - "名單 / 預約 / 成交"
      takeaway: "真正值錢的不是觀看本身，而是後續關係。"
    speaker_notes:
      - "把工具放在商業漏斗裡講，學員會更懂。"
    visual_direction: "漏斗圖，由寬到窄。"

  - id: 26
    title: "案例拆解：一支有效 Reels 長什麼樣"
    subtitle: "把抽象方法落到實際節奏"
    page_copy:
      storyboard:
        - "0-2 秒：痛點 Hook"
        - "3-8 秒：立刻給 1 個答案"
        - "9-14 秒：補常見錯誤"
        - "15-20 秒：CTA 導向留言或 DM"
    speaker_notes:
      - "這頁講完，學生腦中應該會出現一支可拍的片。"
    visual_direction: "像分鏡條，帶秒數。"

  - id: 27
    title: "回去就能開始的 7 天行動表"
    subtitle: "先穩定做，再優化爆"
    page_copy:
      days:
        - "Day 1：定主題與受眾"
        - "Day 2：寫 3 個 Hook"
        - "Day 3：拍 2 支口播"
        - "Day 4：剪出 1 支"
        - "Day 5：上字幕與封面"
        - "Day 6：發佈並觀察數據"
        - "Day 7：依留存重剪一次"
    speaker_notes:
      - "這頁是讓課後執行不落空。"
    visual_direction: "週曆版面，舒服整齊。"

  - id: 28
    title: "總結：有效的 Reels，不靠運氣"
    subtitle: "四件事一起做，內容才會成為生意"
    page_copy:
      recap:
        - "先抓住人"
        - "再講清楚"
        - "接著拍好看"
        - "最後導向下一步"
      closing: "如果沒有轉換設計，再高的觀看也只是漂亮數字。"
    speaker_notes:
      - "結尾要收回商業目標。"
      - "可開放 Q&A 或銜接下一份講義。"
    visual_direction: "大結語置中，下方小字 Q&A。"

delivery_tips:
  pacing:
    session_1: "Slide 1-15，約 60 分鐘，含 8 分鐘練習"
    session_2: "Slide 16-28，約 60 分鐘，含案例與 Q&A"
  recommended_live_demo:
    - "現場改寫一個 Hook"
    - "示範手機安全區構圖"
    - "示範 CapCut 自動字幕修正"
  optional_assets_to_prepare:
    - "3 張成功 Reels 截圖"
    - "1 張字幕過密失敗示範"
    - "環形燈與柔光箱對比圖"
    - "ManyChat 流程截圖"
