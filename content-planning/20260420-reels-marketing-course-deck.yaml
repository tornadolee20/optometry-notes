---
deck:
  meta:
    file_role: "teaching_deck_blueprint"
    title: "Reels 製作實務教學"
    subtitle: "兩堂行銷課教案型簡報"
    date: "2026-04-20"
    language: "zh-TW"
    total_slides: 28
    total_duration_minutes: 120
    session_split:
      session_1: "策略、演算法、腳本"
      session_2: "拍攝、剪輯、自動化、落地"
    audience:
      - "品牌經營者"
      - "社群小編"
      - "個人品牌創作者"
      - "中小企業行銷人員"
    learning_outcomes:
      - "理解 Reels 在 2026 的分發邏輯與內容評估重點"
      - "學會用高留存腳本設計影片節奏"
      - "掌握 9:16 畫面、光線與手機拍攝設定"
      - "建立 CapCut 或剪映的高效率剪輯流程"
      - "把觀看與互動轉成 DM、名單與後續成交"

  design_system:
    concept: "Clean Studio Warmth"
    mood_words:
      - "舒服"
      - "俐落"
      - "專業"
      - "有節奏"
      - "不吵"
    palette:
      ink: "#1F2937"
      ivory: "#F7F3EC"
      paper: "#FFFDFC"
      coral: "#E77B62"
      moss: "#6F8A73"
      sand: "#D9C7AE"
      gold: "#C89B58"
    typography:
      title_font: "Noto Serif TC SemiBold"
      body_font: "Noto Sans TC Regular"
      number_font: "DM Sans Bold"
      fallback: "PingFang TC, Microsoft JhengHei, sans-serif"
    layout_rules:
      - "每張投影片只保留一個主訊息"
      - "每張最多 3 個 bullet，每點不超過 18 字"
      - "留白至少 20%，不要把畫面塞滿"
      - "所有數字與關鍵詞可用 coral 或 gold 強調"
      - "圖片優先滿版或半版，不做零碎拼貼"
      - "內頁統一使用 12 欄格線，左對齊為主"
    visual_devices:
      - "大標題搭配小引言"
      - "卡片式資訊區塊"
      - "粗細對比明顯的數字頁"
      - "柔和米白底搭配暖色重點"
      - "局部線條、圓角框、淡色底塊"
    motion_guidance:
      - "章節頁用淡入與數字遞進"
      - "流程頁用逐步浮現，不要花俏飛入"
      - "案例頁可用前後對照淡切"

  source_distillation:
    removed_or_merged:
      - "大量重複的演算法描述合併為 4 張核心策略頁"
      - "原文零散工具介紹整合成一條剪輯工作流"
      - "引用文獻不逐條鋪陳，只保留教學上必要結論"
      - "設備比較改成決策矩陣，避免資訊過重"
      - "行銷自動化與 CTA 從附帶內容提升為收尾主軸"
    teaching_structure:
      - "先講為什麼值得做"
      - "再講平台怎麼分發"
      - "再講內容怎麼寫"
      - "再講畫面怎麼拍"
      - "最後講如何穩定產出與轉換"

slides:
  - id: 1
    type: "cover"
    title: "Reels 製作實務教學"
    subtitle: "把短影音做成流量、信任與成交"
    key_message: "這不是剪片課而已，而是一套內容變現流程。"
    layout: "full-bleed title cover"
    visual_direction:
      background: "米白底 + 柔和膠片顆粒 + 右側手機直式畫面輪廓"
      accent: "coral 細線 + gold 頁碼"
      image_hint: "一位講者對鏡口播的高質感直式畫面"
    speaker_notes:
      - "先定義今天的目標：不是學會花招，而是學會穩定做出有效的 Reels。"
      - "兩堂課會一路走到策略、腳本、拍攝、剪輯、轉換。"

  - id: 2
    type: "agenda"
    title: "今天會帶走什麼"
    key_message: "讓學員先知道整體地圖，降低資訊焦慮。"
    layout: "two-column agenda"
    left_column:
      - "第一堂：平台邏輯"
      - "第一堂：高留存腳本"
      - "第一堂：爆點與 CTA"
    right_column:
      - "第二堂：拍攝與佈光"
      - "第二堂：剪輯與模板"
      - "第二堂：自動化與轉換"
    visual_direction:
      background: "paper"
      device: "大數字 1 / 2 分區"

  - id: 3
    type: "hook_stat"
    title: "為什麼現在還要做 Reels？"
    key_message: "因為短影音仍是最便宜的觸及入口。"
    layout: "center stat + bottom insight"
    stats:
      - number: "21%"
        label: "行銷人員回報最高 ROI"
      - number: "73%"
        label: "認為 30 秒到 2 分鐘最有影響力"
    takeaway:
      - "圖文在建立信任"
      - "短影音在搶注意力"
      - "兩者不是替代，而是分工"
    visual_direction:
      background: "ivory"
      accent_blocks: ["coral", "sand"]

  - id: 4
    type: "comparison"
    title: "TikTok 與 Reels，不是一樣的戰場"
    key_message: "Reels 更重視品牌感、包裝感與可分享性。"
    layout: "versus cards"
    left_card:
      title: "TikTok"
      bullets:
        - "更娛樂導向"
        - "節奏更野更快"
        - "實驗性更高"
    right_card:
      title: "Instagram Reels"
      bullets:
        - "更重視審美"
        - "更適合品牌形象"
        - "更利於導向 DM 與成交"
    visual_direction:
      background: "paper"
      style: "兩張大卡，圓角，弱陰影"

  - id: 5
    type: "framework"
    title: "2026 Reels 的底層邏輯"
    key_message: "平台在賭一件事：這支影片能不能留人、能不能被分享。"
    layout: "three-pillars"
    pillars:
      - "看得久"
      - "願意分享"
      - "讓人互動"
    support_text:
      - "觀看時間是第一關"
      - "Sends / Shares 是擴散引擎"
      - "Like 與 Comment 更像滿意度訊號"
    visual_direction:
      background: "moss tint"
      icon_style: "極簡線性圖示"

  - id: 6
    type: "process"
    title: "內容怎麼被推廣出去"
    key_message: "不是先給所有人，而是先小量測試，再擴大分發。"
    layout: "horizontal flow"
    steps:
      - "小樣本測試"
      - "看前 1-3 秒反應"
      - "評估留存與分享"
      - "合格才放大"
    teaching_note: "這一頁用來打破『粉絲少就沒救』的迷思。"
    visual_direction:
      background: "paper"
      arrows: "sand"

  - id: 7
    type: "myth_busting"
    title: "三個常見誤會"
    key_message: "很多帳號不是內容不夠努力，而是方向搞錯。"
    layout: "three myth cards"
    myths:
      - myth: "粉絲少就做不起來"
        truth: "新帳號也有非粉測試流量"
      - myth: "影片越長越專業"
        truth: "新受眾更吃短、狠、清楚"
      - myth: "按讚高就代表會爆"
        truth: "分享與停留時間更關鍵"
    visual_direction:
      background: "ivory"
      style: "上錯下對"

  - id: 8
    type: "strategy"
    title: "長度策略：不同目的，不同秒數"
    key_message: "不要用同一種片長解決所有任務。"
    layout: "timeline bands"
    bands:
      - range: "7-15 秒"
        use: "拓新、提高完播、重播"
      - range: "20-45 秒"
        use: "教學、觀點、案例"
      - range: "45-90 秒"
        use: "建立信任、深度說服"
    visual_direction:
      background: "paper"
      highlight: "gold on 20-45 秒"

  - id: 9
    type: "section"
    title: "第一堂重點二"
    subtitle: "腳本不是文案，是注意力編排"
    key_message: "進入高留存腳本段落。"
    layout: "chapter divider"
    visual_direction:
      background: "coral gradient on ivory"
      image_hint: "字幕與鏡頭節奏的抽象圖形"

  - id: 10
    type: "framework"
    title: "一支 Reels 的標準骨架"
    key_message: "Hook、Value、Rehook、CTA。"
    layout: "vertical stack"
    stack:
      - "Hook：讓人停下來"
      - "Value：立刻給答案"
      - "Rehook：中段再拉一次注意力"
      - "CTA：只給一個動作"
    visual_direction:
      background: "paper"
      style: "每層一個色塊，階梯向下"

  - id: 11
    type: "examples"
    title: "Hook 寫法：前三秒只做一件事"
    key_message: "不是把話講完，而是讓人想看下去。"
    layout: "left formula right examples"
    formulas:
      - "痛點直擊"
      - "反常識"
      - "結果前置"
      - "好奇缺口"
    examples:
      - "為什麼你拍 Reels 都像作業？"
      - "99% 的人一開始就把片做長了"
      - "這樣改，你的完播率會差很多"
      - "沒人提醒你的 Reels 第一秒錯誤"
    visual_direction:
      background: "ivory"
      callout: "用 coral 做引號與關鍵詞"

  - id: 12
    type: "examples"
    title: "中段留人：每 3 到 5 秒要有變化"
    key_message: "觀眾不是不願意看，是不願意被拖。"
    layout: "three-column rhythm"
    columns:
      - title: "畫面變化"
        bullets:
          - "推近或切角度"
          - "插入 B-roll"
          - "局部放大"
      - title: "文字變化"
        bullets:
          - "關鍵詞跳出"
          - "數字大字卡"
          - "逐字高亮"
      - title: "語氣變化"
        bullets:
          - "反問一句"
          - "先否定再翻轉"
          - "補一個小案例"
    visual_direction:
      background: "paper"
      style: "三欄卡片"

  - id: 13
    type: "framework"
    title: "Rehook：中途再勾一次"
    key_message: "當觀眾快滑走時，再給一個新的理由留下。"
    layout: "center phrase + sample strips"
    sample_rehooks:
      - "但真正影響觸及的，不是你以為的那個。"
      - "更重要的是，這一步大多數人都漏掉。"
      - "如果你只記得一件事，就是這個。"
    visual_direction:
      background: "moss tint"
      style: "句子像字幕條一樣橫向排列"

  - id: 14
    type: "cta"
    title: "CTA：一支影片只做一個收尾動作"
    key_message: "CTA 太多，轉換反而更差。"
    layout: "single-vs-multi"
    bad_example:
      title: "不要這樣"
      bullets:
        - "按讚"
        - "留言"
        - "追蹤"
        - "點連結"
    good_example:
      title: "請只選一個"
      bullets:
        - "把這支傳給同事"
        - "留言『模板』拿資源"
        - "私訊我『課表』"
    visual_direction:
      background: "paper"
      style: "左亂右清楚"

  - id: 15
    type: "workshop"
    title: "課堂練習：20 秒腳本拆解"
    key_message: "讓學員立刻把抽象方法變成句子。"
    layout: "worksheet"
    prompt:
      - "主題：你要幫誰解決什麼問題？"
      - "Hook：一句話讓他停下來"
      - "Value：給 2 個要點"
      - "CTA：只留 1 個動作"
    duration_minutes: 8
    visual_direction:
      background: "ivory"
      style: "留白大、像工作紙"

  - id: 16
    type: "section"
    title: "第二堂重點一"
    subtitle: "拍攝與畫面，不是設備堆砌，是視覺秩序"
    key_message: "進入拍攝段落。"
    layout: "chapter divider"
    visual_direction:
      background: "moss gradient"
      image_hint: "手機、燈、腳架的極簡 still life"

  - id: 17
    type: "visual_rules"
    title: "9:16 構圖的三個原則"
    key_message: "拍直式影片，畫面中心與安全區比橫式更重要。"
    layout: "three visual cards"
    principles:
      - title: "主體置中"
        detail: "重要人物與商品維持中軸"
      - title: "保留安全區"
        detail: "避開上方資訊與右下互動 UI"
      - title: "預留字幕空間"
        detail: "頭頂或側邊留乾淨背景"
    visual_direction:
      background: "paper"
      image_hint: "手機 UI 安全區示意"

  - id: 18
    type: "camera_motion"
    title: "運鏡只要會兩種就夠了"
    key_message: "穩定推近，和能藏剪接的甩鏡。"
    layout: "two-panel demo"
    left_panel:
      title: "穩定推近"
      bullets:
        - "適合口播"
        - "增加壓迫感"
        - "讓重點更集中"
    right_panel:
      title: "甩鏡轉場"
      bullets:
        - "適合切段落"
        - "可藏剪接點"
        - "節奏感更強"
    visual_direction:
      background: "ivory"
      style: "動態箭頭與模糊軌跡"

  - id: 19
    type: "decision_matrix"
    title: "環形燈 vs 柔光箱：怎麼選"
    key_message: "先看你要的是方便，還是質感。"
    layout: "comparison matrix"
    rows:
      - factor: "光感"
        ring_light: "平、亮、直接"
        softbox: "柔、厚、立體"
      - factor: "適合場景"
        ring_light: "近距離 Vlog、直播"
        softbox: "訪談、課程、口播"
      - factor: "限制"
        ring_light: "容易扁平與反光"
        softbox: "占空間、架設較慢"
    recommendation:
      - "快速開拍選環形燈"
      - "想做高級感選柔光箱"
      - "有預算就做三點打光"
    visual_direction:
      background: "paper"
      style: "矩陣表改成卡片表格"

  - id: 20
    type: "settings"
    title: "iPhone 拍 Reels 的實用設定"
    key_message: "先把素材拍對，後製才不會救火。"
    layout: "four settings cards"
    settings:
      - "解析度：4K"
      - "幀率：24fps 或 30fps 為主"
      - "關閉 HDR"
      - "鎖白平衡 / 鎖鏡頭"
    footnote: "若要慢動作再切 60fps 或更高，不要全部素材都拍高幀率。"
    visual_direction:
      background: "ivory"
      style: "像手機設定頁，但更簡化"

  - id: 21
    type: "section"
    title: "第二堂重點二"
    subtitle: "剪輯不是加特效，而是刪掉多餘"
    key_message: "進入後期流程段落。"
    layout: "chapter divider"
    visual_direction:
      background: "sand gradient"
      image_hint: "時間軸、字幕、節拍標記的抽象畫面"

  - id: 22
    type: "workflow"
    title: "CapCut / 剪映的標準工作流"
    key_message: "先粗剪，再字幕，再節奏，再風格。"
    layout: "step cards"
    steps:
      - "粗剪：刪停頓與贅字"
      - "字幕：自動字幕後手修"
      - "節奏：切點貼合語氣與節拍"
      - "視覺：加少量轉場與字卡"
      - "輸出：1080p 高碼率"
    visual_direction:
      background: "paper"
      style: "五張橫向卡片"

  - id: 23
    type: "editing_principles"
    title: "字幕與文字排版的審美原則"
    key_message: "字幕是第二條注意力軌道。"
    layout: "do-dont"
    do:
      - "每行短"
      - "關鍵字上色"
      - "出現節奏跟語氣走"
    dont:
      - "整段塞滿"
      - "特效太多"
      - "每個字都跳"
    visual_direction:
      background: "ivory"
      style: "左對右錯，底部附一條模擬字幕帶"

  - id: 24
    type: "quality_control"
    title: "讓影片看起來貴的 5 個細節"
    key_message: "高級感通常不是多，而是準。"
    layout: "number list"
    details:
      - "色調一致"
      - "曝光穩定"
      - "聲音乾淨"
      - "切點果斷"
      - "封面有主題字"
    visual_direction:
      background: "paper"
      number_style: "大數字 gold"

  - id: 25
    type: "automation"
    title: "不要只追觀看，要接到轉換"
    key_message: "最有價值的 Reels，會把流量帶到 DM。"
    layout: "funnel diagram"
    funnel:
      - "Reels 觀看"
      - "留言關鍵字"
      - "ManyChat 自動回覆"
      - "DM 資源交換"
      - "名單 / 預約 / 成交"
    teaching_note: "這頁把 ManyChat 放在商業流程裡，而不是工具介紹。"
    visual_direction:
      background: "moss tint"
      style: "由寬到窄的漏斗"

  - id: 26
    type: "case_study"
    title: "案例拆解：一支有效 Reels 長什麼樣"
    key_message: "把抽象方法落到一支片的節奏。"
    layout: "timeline storyboard"
    storyboard:
      - second: "0-2"
        content: "痛點 Hook"
      - second: "3-8"
        content: "快速給 1 個核心答案"
      - second: "9-14"
        content: "補一個常見錯誤"
      - second: "15-20"
        content: "CTA 導向留言或 DM"
    visual_direction:
      background: "paper"
      style: "像分鏡腳本條"

  - id: 27
    type: "action_plan"
    title: "回去就能開始的 7 天行動表"
    key_message: "先穩定做，再優化爆。"
    layout: "week planner"
    days:
      - "Day 1：定主題與受眾"
      - "Day 2：寫 3 個 Hook"
      - "Day 3：拍 2 支口播"
      - "Day 4：剪出 1 支"
      - "Day 5：上字幕與封面"
      - "Day 6：發佈並觀察數據"
      - "Day 7：依留存重剪一次"
    visual_direction:
      background: "ivory"
      style: "週曆形式，舒服留白"

  - id: 28
    type: "closing"
    title: "總結：有效的 Reels，不靠運氣"
    key_message: "平台邏輯、腳本節奏、畫面品質、轉換設計，四件事一起做。"
    layout: "closing statement"
    recap:
      - "先抓住人"
      - "再講清楚"
      - "接著拍好看"
      - "最後導向下一步"
    closing_cta: "如果要，我可以再把這份 YAML 直接延伸成 PPT 逐頁文案版或真正的投影片稿。"
    visual_direction:
      background: "coral on ivory with subtle vignette"
      ending_style: "一句收束 + 小字 Q&A"

presentation_notes:
  slide_density_rule: "原則上每張 30 秒到 5 分鐘，不讓任何一張成為資訊泥巴。"
  instructor_tips:
    - "講演算法時少講名詞，多講『平台在乎什麼』"
    - "講腳本時直接示範句子，比抽象原理更有記憶點"
    - "拍攝與剪輯段落盡量搭配示例畫面或短片"
    - "最後一定把流量導向商業目標，不然學生只會學到拍片"
