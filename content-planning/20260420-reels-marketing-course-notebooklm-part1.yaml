slides:
  - id: 1
    title: "Reels 製作實務教學"
    subtitle: "Part 1｜平台邏輯、腳本、CTA"
    body:
      - "這不是單純的剪片課，而是一套從注意力到轉換的內容流程。"
      - "本段先處理三件事：為什麼做、平台怎麼推、腳本怎麼留人。"
    visual_direction: "米白底，大標置左，右側放高質感直式口播畫面。"

  - id: 2
    title: "這一份會帶走什麼"
    subtitle: "先看 Part 1 的地圖"
    body:
      - "Reels 為什麼仍值得做"
      - "2026 演算法在乎什麼"
      - "高留存腳本怎麼寫"
      - "CTA 怎麼設計才不混亂"
    visual_direction: "雙欄議程頁，大數字與細線分隔。"

  - id: 3
    title: "為什麼現在還要做 Reels？"
    subtitle: "因為它仍是最便宜的注意力入口"
    body:
      - "短影音仍是社群平台最強觸及格式之一。"
      - "它最適合在短時間傳遞情緒、觀點與品牌印象。"
      - "對品牌經營者來說，Reels 不是附加選項，而是基本功。"
    highlight_stats:
      - "21% 行銷人員回報短影音帶來最高 ROI"
      - "73% 認為 30 秒到 2 分鐘最具影響力"
    visual_direction: "中央大數字，下方一條總結句。"

  - id: 4
    title: "TikTok 與 Reels，不是一樣的戰場"
    subtitle: "同樣是短影音，打法不一樣"
    body_left:
      heading: "TikTok"
      points:
        - "娛樂性更強"
        - "節奏更野更快"
        - "容許更粗糙的原生感"
    body_right:
      heading: "Instagram Reels"
      points:
        - "更重視審美與包裝"
        - "更適合品牌經營"
        - "更容易導向私訊與成交"
    visual_direction: "兩張對照卡片，Reels 區塊更精緻。"

  - id: 5
    title: "2026 Reels 的底層邏輯"
    subtitle: "平台在乎的其實只有三件事"
    body:
      - "看得久：觀看時間與留存率"
      - "願意分享：私訊轉發與分享"
      - "願意互動：按讚、留言、收藏"
    takeaway: "平台的本質問題是：這支內容能不能留住人、能不能被帶去別人的對話裡。"
    visual_direction: "三個大圓或三根柱，簡潔有重量。"

  - id: 6
    title: "內容怎麼被推廣出去"
    subtitle: "不是先推給所有人，而是先小量測試"
    body:
      - "平台會先把影片丟進小樣本測試池。"
      - "它先看前 1 到 3 秒的反應，再看留存與分享。"
      - "表現過關，才會進入更大的分發。"
    takeaway: "粉絲少不代表沒機會，因為非粉測試流量一直存在。"
    visual_direction: "水平箭頭流程圖，從小到大。"

  - id: 7
    title: "三個常見誤會"
    subtitle: "很多帳號不是不努力，是努力方向錯了"
    body:
      - "粉絲少就做不起來：錯，平台先測內容不是先測名氣。"
      - "影片越長越專業：錯，新受眾往往更吃短、狠、清楚。"
      - "按讚高就一定會爆：錯，分享與停留時間更關鍵。"
    visual_direction: "上方誤會，下方真相，三列卡片。"

  - id: 8
    title: "長度策略：不同目的，不同秒數"
    subtitle: "不要用同一種片長解決所有問題"
    body:
      - "7-15 秒：適合拓新、提高完播與重播"
      - "20-45 秒：適合教學、觀點、案例"
      - "45-90 秒：適合建立信任與深度說服"
    takeaway: "想打新受眾，通常先從短而狠開始。"
    visual_direction: "時間軸視覺，20-45 秒用 gold 重點標示。"

  - id: 9
    title: "腳本不是文案，是注意力編排"
    subtitle: "影片是否留人，常常在你開口前就決定了"
    body:
      - "好腳本不是內容很多，而是節奏對。"
      - "Reels 更像把觀眾一步一步帶過去，而不是完整講述。"
    visual_direction: "章節頁，大字與抽象字幕條。"

  - id: 10
    title: "一支 Reels 的標準骨架"
    subtitle: "Hook、Value、Rehook、CTA"
    body:
      - "Hook：讓人停下來"
      - "Value：立刻給答案"
      - "Rehook：中段再拉一次注意力"
      - "CTA：只給一個明確動作"
    visual_direction: "四層階梯向下，節奏清楚。"

  - id: 11
    title: "Hook 寫法：前三秒只做一件事"
    subtitle: "讓人停，不是把話講完"
    body:
      - "常見 Hook 類型：痛點直擊、反常識、結果前置、好奇缺口"
      - "例句 1：為什麼你拍 Reels 都像作業？"
      - "例句 2：99% 的人一開始就把片做長了"
      - "例句 3：沒人提醒你的第一秒錯誤"
    visual_direction: "左邊公式，右邊例句，用引號與色塊強化。"

  - id: 12
    title: "中段留人：每 3 到 5 秒要有變化"
    subtitle: "觀眾不是不看，是不想被拖"
    body:
      - "畫面變化：切角度、推近、插 B-roll"
      - "文字變化：關鍵字跳出、數字放大、逐字高亮"
      - "語氣變化：反問、翻轉、小案例"
    takeaway: "這些變化的目的不是炫技，而是維持注意力節奏。"
    visual_direction: "三欄卡片，像節奏表。"

  - id: 13
    title: "Rehook：中途再勾一次"
    subtitle: "觀眾快滑走時，再給一個留下的理由"
    body:
      - "但真正影響觸及的，不是你以為的那個。"
      - "更重要的是，這一步大多數人都漏掉。"
      - "如果你只記得一件事，就是這個。"
    takeaway: "中段不是延續，而是重新點燃一次注意力。"
    visual_direction: "三條字幕樣式橫排，像實際影片字卡。"

  - id: 14
    title: "CTA：一支影片只做一個收尾動作"
    subtitle: "CTA 太多，轉換反而更差"
    body:
      - "錯誤做法：按讚、留言、追蹤、點連結，全都要。"
      - "正確做法：把這支傳給同事；留言『模板』拿資源；私訊我『課表』。"
      - "一支片只選一個動作，觀眾比較不會卡住。"
    closing_bridge: "Part 2 會接著進入拍攝、剪輯、畫面質感與轉換流程。"
    visual_direction: "左亂右清楚，最後一行當承上啟下。"
